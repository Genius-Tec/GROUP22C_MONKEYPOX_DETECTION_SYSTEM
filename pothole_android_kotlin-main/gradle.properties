# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# Increased memory for better stability with Kotlin 2.0
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError

# AndroidX package structure
android.useAndroidX=true

# Kotlin code style
kotlin.code.style=official

# Non-transitive R class for faster builds
android.nonTransitiveRClass=true

# Support 16 KB page sizes
android.bundle.enableUncompressedNativeLibs=true

# Use in-process strategy to avoid Kotlin Daemon connection issues
kotlin.compiler.execution.strategy=in-process

# Fix for Kotlin Compiler Daemon connection issues (fallback if not using in-process)
kotlin.daemon.jvmargs=-Xmx2048m -Djava.rmi.server.hostname=127.0.0.1
